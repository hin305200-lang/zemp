<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#eef1f7">
<meta name="color-scheme" content="light">
<title>Zemp & Partner — CRM</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600;700&family=Syne:wght@600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../crm.css?v=17">
</head>
<body>
<div class="fx" aria-hidden="true"></div>

<div id="gate" class="gate open">
  <div class="gate-card">
    <div class="brand"><span class="pulse"></span>Zemp & Partner · CRM</div>
    <h1>Authorize</h1>
    <p>Staff CRM. Client telemetry, presence, and dossiers.</p>
    <p class="err" id="gateErr" hidden></p>
    <form id="admForm" method="post" action="#" autocomplete="off">
      <label for="admEmail">Email</label>
      <input id="admEmail" name="staff_user" type="text" inputmode="email" autocomplete="username" autocapitalize="off" spellcheck="false" value="" required>
      <label for="admPass">Password</label>
      <div class="pw-wrap">
        <input id="admPass" name="staff_pass" type="password" autocomplete="current-password" value="" required>
        <button type="button" class="pw-toggle" aria-label="Show password" aria-pressed="false">
          <svg class="pw-eye" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/></svg>
          <svg class="pw-eye-off" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 3l18 18"/><path d="M10.7 10.7A3 3 0 0 0 13.3 13.3"/><path d="M9.9 5.1A11 11 0 0 1 12 5c6.4 0 10 7 10 7a18.5 18.5 0 0 1-2.2 3.2"/><path d="M6.1 6.1C3.8 7.9 2 12 2 12s3.6 7 10 7a10.8 10.8 0 0 0 4.4-.9"/></svg>
        </button>
      </div>
      <button type="submit" id="admGo">Enter CRM</button>
    </form>
  </div>
</div>

<div id="app" class="lattice">
  <aside class="side">
    <div class="side-brand">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" aria-hidden="true"><rect x="2" y="2" width="12" height="12" rx="4" fill="url(#lgc)"/><rect x="10" y="10" width="12" height="12" rx="4" fill="url(#lgc)" opacity=".55"/><defs><linearGradient id="lgc" x1="0" y="0" x2="1" y="1"><stop stop-color="#2563eb"/><stop offset="1" stop-color="#0f9d9a"/></linearGradient></defs></svg>
      <div>Zemp & Partner<span>CRM</span></div>
    </div>
    <button class="nav on" data-view="home" type="button">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><rect x="3" y="3" width="7" height="7" rx="1.5"/><rect x="14" y="3" width="7" height="7" rx="1.5"/><rect x="3" y="14" width="7" height="7" rx="1.5"/><rect x="14" y="14" width="7" height="7" rx="1.5"/></svg>
      <span>CRM</span>
    </button>
    <button class="nav" data-view="clients" type="button">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><circle cx="9" cy="8" r="3"/><circle cx="16" cy="9" r="2.4"/><path d="M4 19c.4-3 2.4-5 5-5s4.6 2 5 5"/><path d="M14 19c.2-2 1.4-3.4 3.2-3.8 1.8.3 3.2 1.8 3.8 3.8"/></svg>
      <span>Nodes</span>
    </button>
    <button class="nav" data-view="live" type="button">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><circle cx="12" cy="12" r="2"/><path d="M7 12a5 5 0 0 1 5-5"/><path d="M17 12a5 5 0 0 1-5 5"/><circle cx="12" cy="12" r="8"/></svg>
      <span>Presence</span>
    </button>
    <button class="nav" data-view="feed" type="button">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><path d="M4 7h16M4 12h10M4 17h13"/></svg>
      <span>Stream</span>
    </button>
    <button class="nav" data-view="intel" type="button">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><path d="M12 3 20 8v8l-8 5-8-5V8l8-5z"/><path d="M12 8v8M8.5 10.5 12 12l3.5-1.5"/></svg>
      <span>Intel</span>
    </button>
    <div class="side-foot">
      <div class="who-kicker">Operator</div>
      <div id="admWho">—</div>
      <button type="button" id="admOut">Sign out</button>
      <a href="../index.html">Public site</a>
    </div>
  </aside>
  <main>
    <header class="top">
      <div>
        <div class="kicker" id="kicker">Command surface</div>
        <h1 id="title">CRM</h1>
      </div>
      <div class="top-meta">
        <div class="chip-live"><span class="pulse"></span><span id="signal">STANDBY</span></div>
        <time id="clock">--:--:--</time>
        <input id="globalQ" type="search" enterkeyhint="search" placeholder="Search first name or email…">
      </div>
    </header>
    <nav class="m-nav" aria-label="CRM sections">
      <button class="nav on" data-view="home" type="button">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><rect x="3" y="3" width="7" height="7" rx="1.5"/><rect x="14" y="3" width="7" height="7" rx="1.5"/><rect x="3" y="14" width="7" height="7" rx="1.5"/><rect x="14" y="14" width="7" height="7" rx="1.5"/></svg>
        <span>CRM</span>
      </button>
      <button class="nav" data-view="clients" type="button">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><circle cx="9" cy="8" r="3"/><circle cx="16" cy="9" r="2.4"/><path d="M4 19c.4-3 2.4-5 5-5s4.6 2 5 5"/><path d="M14 19c.2-2 1.4-3.4 3.2-3.8 1.8.3 3.2 1.8 3.8 3.8"/></svg>
        <span>Nodes</span>
      </button>
      <button class="nav" data-view="live" type="button">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><circle cx="12" cy="12" r="2"/><path d="M7 12a5 5 0 0 1 5-5"/><path d="M17 12a5 5 0 0 1-5 5"/><circle cx="12" cy="12" r="8"/></svg>
        <span>Presence</span>
      </button>
      <button class="nav" data-view="feed" type="button">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><path d="M4 7h16M4 12h10M4 17h13"/></svg>
        <span>Stream</span>
      </button>
      <button class="nav" data-view="intel" type="button">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><path d="M12 3 20 8v8l-8 5-8-5V8l8-5z"/><path d="M12 8v8M8.5 10.5 12 12l3.5-1.5"/></svg>
        <span>Intel</span>
      </button>
    </nav>
    <div class="body" id="view"></div>
  </main>
</div>
<script src="../gate.js?v=2"></script>
<script src="../crm.js?v=22"></script>
</body>
</html>
