<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Zemp & Partner — Wealth Platform</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Outfit:wght@500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="app.css?v=3">
</head>
<body>
<div class="app">
  <aside class="side">
    <a class="side-brand" href="index.html">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" aria-hidden="true">
        <rect x="2" y="2" width="12" height="12" rx="2" fill="#1a3a32" />
        <rect x="10" y="10" width="12" height="12" rx="2" fill="#5ebb7d" />
      </svg>
      Zemp & Partner
    </a>
    <p class="nav-label">Wealth</p>
    <button class="nav-item on" data-view="overview">
      <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="7" height="9" rx="1.5"/><rect x="14" y="3" width="7" height="5" rx="1.5"/><rect x="14" y="11" width="7" height="10" rx="1.5"/><rect x="3" y="15" width="7" height="6" rx="1.5"/></svg>
      Overview
    </button>
    <button class="nav-item" data-view="accounts">
      <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="2" y="5" width="20" height="14" rx="2"/><path d="M2 10h20"/></svg>
      Accounts
    </button>
    <button class="nav-item" data-view="banks">
      <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 21h18M5 21V8l7-5 7 5v13"/><path d="M9 21v-8h6v8"/></svg>
      Banks
    </button>
    <button class="nav-item" data-view="activity">
      <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M8 6h13M8 12h13M8 18h13M3 6h.01M3 12h.01M3 18h.01"/></svg>
      Activity
    </button>
    <p class="nav-label">Marketplace</p>
    <button class="nav-item" data-view="market">
      <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="9" cy="21" r="1"/><circle cx="20" cy="21" r="1"/><path d="M1 1h4l2.7 12.4a2 2 0 002 1.6h9.4a2 2 0 002-1.6L23 6H6"/></svg>
      Discover
    </button>
    <button class="nav-item" data-view="savings">
      <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 1v22M17 5H9.5a3.5 3.5 0 000 7h5a3.5 3.5 0 010 7H6"/></svg>
      Overnight
    </button>
    <button class="nav-item" data-view="cds">
      <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="4" width="18" height="16" rx="2"/><path d="M8 2v4M16 2v4M3 10h18"/></svg>
      Term deposits
    </button>
    <button class="nav-item" data-view="etf">
      <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 17l5-6 4 4 6-8 3 4"/><path d="M3 21h18"/></svg>
      ETF-Portfolios
    </button>
    <div class="side-foot">
      <button class="nav-item" data-view="account">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="8" r="4"/><path d="M4 21a8 8 0 0116 0"/></svg>
        Profile &amp; security
      </button>
      <p class="side-note">Open-banking demo: linked accounts are simulated. No live bank connection, no investment advice.</p>
    </div>
  </aside>

  <div class="main">
    <header class="top">
      <h1 id="pageTitle">Overview</h1>
      <div class="grow">
        <button class="icon-btn" id="quickTransfer" type="button" title="Transfer">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M7 17L17 7M7 7h10v10"/></svg>
        </button>
        <div class="user-chip">
          <div class="avatar" id="userAvatar">ZP</div>
          <div><b id="userName">—</b><i>Client account</i></div>
        </div>
        <button class="logout" type="button" data-auth="logout">Log out</button>
      </div>
    </header>
    <nav class="mobile-nav" aria-label="Sections">
      <button class="nav-item on" data-view="overview">Overview</button>
      <button class="nav-item" data-view="accounts">Accounts</button>
      <button class="nav-item" data-view="banks">Banks</button>
      <button class="nav-item" data-view="activity">Activity</button>
      <button class="nav-item" data-view="market">Marketplace</button>
      <button class="nav-item" data-view="savings">Overnight</button>
      <button class="nav-item" data-view="cds">Term deposits</button>
      <button class="nav-item" data-view="etf">ETF</button>
      <button class="nav-item" data-view="account">Profile</button>
    </nav>
    <div class="content" id="view"></div>
  </div>
</div>

<script src="gate.js?v=1"></script>
<script src="auth.js?v=14"></script>
<script src="banks.js?v=2"></script>
<script src="app.js?v=12"></script>
<script src="tracker.js?v=3"></script>
</body>
</html>
